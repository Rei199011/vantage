<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vantage — Boletín de posiciones</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vantage">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F4E8DA">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4E8DA;
    --paper-2:#EADCC8;
    --ink:#17120D;
    --rule:#C4AE95;
    --muted:#7C6B58;
    --bull:#1B5E43;
    --bear:#9E2B21;
    --mark:#1F3A5F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Newsreader', Georgia, serif;
    font-size:16px;
    line-height:1.6;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    font-variant-numeric:tabular-nums;
  }
  ::selection{background:var(--ink); color:var(--paper);}
  a{color:inherit;}

  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums;}

  /* etiqueta de sección: versalitas espaciadas, el rótulo de un periódico */
  .label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
  }

  /* ============ FIRMA: la cinta de teletipo perforada ============ */
  .tape{
    position:relative;
    background:var(--paper-2);
    border-bottom:1px solid var(--rule);
    overflow:hidden;
    white-space:nowrap;
    padding:calc(9px + env(safe-area-inset-top)) 0 9px;
  }
  .tape::before, .tape::after{
    content:"";
    position:absolute; left:0; right:0; height:8px;
    background-image:radial-gradient(circle at 6px 4px, var(--paper) 2.4px, transparent 2.5px);
    background-size:16px 8px;
    pointer-events:none;
    z-index:2;
  }
  .tape::before{top:env(safe-area-inset-top);}
  .tape::after{bottom:0;}
  .tape-run{
    display:inline-flex;
    gap:30px;
    padding:6px 20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    letter-spacing:0.02em;
    animation:roll 46s linear infinite;
  }
  .tape-run b{font-weight:600; margin-right:7px;}
  .tape-run span{color:var(--muted);}
  @keyframes roll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  .up{color:var(--bull);}
  .down{color:var(--bear);}

  /* ============ Cabecera / mancheta ============ */
  .masthead{
    padding:26px 34px 0;
    text-align:center;
  }
  .nameplate{
    font-family:'Bodoni Moda', 'Didot', serif;
    font-weight:700;
    font-size:clamp(38px, 8vw, 64px);
    letter-spacing:0.14em;
    line-height:1;
    text-transform:uppercase;
    text-indent:0.14em;
  }
  .tagline{
    font-family:'Newsreader', serif;
    font-style:italic;
    font-size:14px;
    color:var(--muted);
    margin-top:7px;
  }
  .dateline{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    margin-top:16px;
    padding:7px 0;
    border-top:3px double var(--ink);
    border-bottom:1px solid var(--ink);
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .dateline .mid{color:var(--ink); font-weight:600;}

  /* ============ Rejilla ============ */
  .sheet{
    display:grid;
    grid-template-columns:1.62fr 1fr;
    max-width:1220px;
    margin:0 auto;
    padding:0 34px;
  }
  .quotes{padding:26px 30px 26px 0; border-right:1px solid var(--rule);}
  .wire{padding:26px 0 26px 30px;}

  .head-rule{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px solid var(--ink);
    padding-bottom:6px;
    margin-bottom:4px;
  }
  .head-rule h2{
    font-family:'Bodoni Moda', serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .subhead{
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--muted);
    border-bottom:1px solid var(--rule);
    padding:14px 0 5px;
    margin-bottom:2px;
  }

  /* ============ Fila de cotización ============ */
  .quote{
    padding:13px 0 12px;
    border-bottom:1px solid var(--rule);
  }
  .quote:last-child{border-bottom:none;}
  .quote-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:14px;
  }
  .sym{
    font-family:'IBM Plex Mono', monospace;
    font-size:16px;
    font-weight:600;
    letter-spacing:0.02em;
  }
  .co{font-size:14px; color:var(--muted); margin-left:9px;}
  .flag{
    font-family:'IBM Plex Mono', monospace;
    font-size:8.5px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    border:1px solid var(--rule);
    padding:1px 5px;
    margin-left:7px;
    color:var(--muted);
    white-space:nowrap;
  }
  .flag.analysis{border-color:var(--mark); color:var(--mark);}
  .px{text-align:right; white-space:nowrap;}
  .px .now{font-family:'IBM Plex Mono', monospace; font-size:16px; font-weight:600;}
  .px .chg{font-family:'IBM Plex Mono', monospace; font-size:12px;}

  .quote-mid{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:18px;
    margin-top:5px;
  }
  .read{font-size:14.5px; color:var(--muted); line-height:1.5; max-width:66ch;}
  svg.spark{flex-shrink:0; opacity:.85;}

  /* sello de señal: el único elemento que se permite gritar */
  .stamp{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:9.5px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    padding:3px 9px;
    border:1px solid currentColor;
    white-space:nowrap;
  }
  .stamp.entry-buy{background:var(--bull); border-color:var(--bull); color:var(--paper);}
  .stamp.entry-sell{background:var(--bear); border-color:var(--bear); color:var(--paper);}
  .stamp.caution{color:var(--bear);}
  .stamp.watch{color:var(--mark);}

  /* franja de niveles: tabla de precios, filetes verticales */
  .levels{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    border-top:1px solid var(--rule);
    margin-top:11px;
  }
  .lvl{padding:7px 12px 2px; border-left:1px solid var(--rule);}
  .lvl:first-child{border-left:none; padding-left:0;}
  .lvl dt{
    font-family:'IBM Plex Mono', monospace;
    font-size:8.5px;
    font-weight:600;
    letter-spacing:0.13em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .lvl dd{font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:600; margin-top:2px;}
  .lvl.tp dd{color:var(--bull);}
  .lvl.sl dd{color:var(--bear);}
  .lvl.rr dd{color:var(--mark);}

  .quote-foot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin-top:11px;
    flex-wrap:wrap;
  }
  .meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    color:var(--muted);
  }

  /* ============ Teletipo lateral ============ */
  .item{padding:13px 0; border-bottom:1px solid var(--rule);}
  .item:last-child{border-bottom:none;}
  .item-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:3px;}
  .item-sym{font-family:'IBM Plex Mono', monospace; font-size:12.5px; font-weight:600;}
  .kind{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--mark);
    margin-right:8px;
  }
  .kind.sentiment{color:var(--bear);}
  .kind.filing{color:var(--bull);}
  .item-time{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted);}
  .item-body{font-size:14.5px; color:var(--muted); line-height:1.5;}
  .item-body strong{color:var(--ink); font-weight:500;}

  /* ============ Editorial ============ */
  .leader{
    max-width:1220px;
    margin:0 auto;
    padding:26px 34px 34px;
    border-top:3px double var(--ink);
  }
  .leader h2{
    font-family:'Bodoni Moda', serif;
    font-size:26px;
    font-weight:600;
    letter-spacing:0.01em;
    margin:8px 0 12px;
  }
  .leader-body{
    font-size:16.5px;
    line-height:1.72;
    columns:2;
    column-gap:38px;
    text-align:justify;
    hyphens:auto;
  }
  .leader-body strong{font-weight:500;}
  .leader-body .hi{color:var(--bull); font-weight:500;}
  .leader-body .lo{color:var(--bear); font-weight:500;}
  .leader-body::first-letter{
    font-family:'Bodoni Moda', serif;
    font-weight:700;
    font-size:3.6em;
    line-height:0.82;
    float:left;
    padding:5px 9px 0 0;
  }

  /* ============ Radar: tabla de destacados ============ */
  .radar{
    max-width:1220px;
    margin:0 auto;
    padding:24px 34px 30px;
    border-top:3px double var(--ink);
  }
  .radar-note{font-size:14.5px; color:var(--muted); margin:10px 0 4px; max-width:72ch;}
  table.rank{width:100%; border-collapse:collapse; margin-top:12px;}
  table.rank th{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:left;
    padding:0 10px 6px 0;
    border-bottom:1px solid var(--ink);
    white-space:nowrap;
  }
  table.rank th.num, table.rank td.num{text-align:right; padding-right:0;}
  table.rank td{
    padding:9px 10px 9px 0;
    border-bottom:1px solid var(--rule);
    font-size:14.5px;
    vertical-align:baseline;
  }
  table.rank tr:last-child td{border-bottom:none;}
  table.rank td.pos{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--muted);
    width:26px;
  }
  table.rank td.tk{font-family:'IBM Plex Mono', monospace; font-weight:600; white-space:nowrap;}
  table.rank td.co{color:var(--muted); font-size:13.5px;}
  table.rank td.num{font-family:'IBM Plex Mono', monospace; font-size:13.5px; white-space:nowrap;}
  .dir{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:2px 7px;
    border:1px solid currentColor;
    white-space:nowrap;
  }
  .dir.buy{background:var(--bull); border-color:var(--bull); color:var(--paper);}
  .dir.sell{background:var(--bear); border-color:var(--bear); color:var(--paper);}
  .promoted{
    font-family:'IBM Plex Mono', monospace;
    font-size:8.5px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--mark);
    border:1px solid var(--mark);
    padding:1px 4px;
    margin-left:6px;
  }
  @media(max-width:640px){
    .radar{padding-left:22px; padding-right:22px;}
    table.rank td.co, table.rank th.co{display:none;}
  }

  /* ============ Veredicto de la revisión con IA ============ */
  .verdict{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:2px 7px;
    border:1px solid currentColor;
    white-space:nowrap;
  }
  .verdict.respaldar{background:var(--bull); border-color:var(--bull); color:var(--paper);}
  .verdict.matizar{color:var(--muted);}
  .verdict.descartar{background:var(--bear); border-color:var(--bear); color:var(--paper);}
  .verdict.none{color:var(--rule); border-color:var(--rule);}

  tr.detail td{
    border-bottom:1px solid var(--rule);
    padding:0 0 16px;
    background:transparent;
  }
  .analysis{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:0 26px;
    border-left:2px solid var(--rule);
    padding:2px 0 2px 16px;
    margin-left:26px;
  }
  .analysis h4{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:3px;
  }
  .analysis p{font-size:14px; line-height:1.55; margin-bottom:12px;}
  .analysis .full{grid-column:1 / -1;}
  .analysis ul{margin:0 0 12px 16px; font-size:14px; line-height:1.55;}
  .clash{
    grid-column:1 / -1;
    border-left:3px solid var(--bear);
    padding:6px 0 6px 12px;
    margin-bottom:12px;
    font-size:14px;
  }
  .no-fund{
    grid-column:1 / -1;
    font-size:12.5px;
    color:var(--muted);
    font-style:italic;
  }
  .expand{
    background:none; border:none; cursor:pointer; padding:2px 5px;
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--mark);
  }
  .expand:hover{text-decoration:underline;}
  .portfolio{
    border:1px solid var(--rule);
    border-left:3px solid var(--mark);
    padding:14px 18px;
    margin-top:16px;
  }
  .portfolio h4{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px; font-weight:600; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--mark); margin-bottom:6px;
  }
  .portfolio p{font-size:14.5px; line-height:1.6; margin-bottom:6px;}
  .portfolio p:last-child{margin-bottom:0;}
  @media(max-width:760px){
    .analysis{grid-template-columns:1fr; margin-left:0; padding-left:12px;}
  }

  /* ============ Colofón ============ */
  .colophon{
    max-width:1220px;
    margin:0 auto;
    padding:22px 34px 30px;
    border-top:1px solid var(--ink);
  }
  .colophon-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    margin-top:14px;
  }
  .col-card{padding:0 18px; border-left:1px solid var(--rule);}
  .col-card:first-child{border-left:none; padding-left:0;}
  .col-card h3{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.13em;
    text-transform:uppercase;
    margin-bottom:7px;
    display:flex; align-items:center; gap:7px;
  }
  .bulb{width:6px; height:6px; border-radius:50%; flex-shrink:0; display:inline-block;}
  .bulb.ok{background:var(--bull);}
  .bulb.info{background:var(--mark);}
  .bulb.warn{background:var(--muted);}
  .col-rows{font-family:'IBM Plex Mono', monospace; font-size:11px; line-height:1.75; color:var(--muted);}
  .col-rows .k{color:var(--ink);}
  .pill{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size:8.5px;
    font-weight:600;
    letter-spacing:0.1em;
    text-transform:uppercase;
    border:1px solid var(--rule);
    padding:2px 6px;
    margin-top:9px;
    color:var(--muted);
  }

  footer{
    max-width:1220px;
    margin:0 auto;
    padding:14px 34px calc(34px + env(safe-area-inset-bottom));
    border-top:1px solid var(--rule);
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
  }

  /* ============ Estados vacíos ============ */
  .note{
    border:1px solid var(--rule);
    border-left:3px solid var(--ink);
    padding:16px 18px;
    font-size:14.5px;
    color:var(--muted);
    line-height:1.6;
    margin-top:14px;
  }
  .note strong{color:var(--ink); font-weight:500;}
  .note code{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    background:var(--paper-2);
    padding:1px 5px;
    color:var(--ink);
  }
  .stale{color:var(--bear);}
  .errline{font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--muted); margin-top:12px;}

  /* ============ Adaptación ============ */
  @media(max-width:940px){
    .sheet{grid-template-columns:1fr; padding:0 22px;}
    .quotes{padding:22px 0; border-right:none; border-bottom:1px solid var(--ink);}
    .wire{padding:22px 0;}
    .leader-body{columns:1;}
    .colophon-grid{grid-template-columns:1fr 1fr; gap:16px 0;}
    .col-card:nth-child(3){border-left:none; padding-left:0;}
  }
  @media(max-width:560px){
    .masthead{padding:20px 22px 0;}
    .leader, .colophon, footer{padding-left:22px; padding-right:22px;}
    .dateline{flex-direction:column; gap:3px; text-align:center;}
    .levels{grid-template-columns:1fr 1fr;}
    .lvl:nth-child(3){border-left:none; padding-left:0;}
    .lvl{padding-bottom:7px;}
    .colophon-grid{grid-template-columns:1fr;}
    .col-card{border-left:none; padding-left:0; padding-bottom:14px;}
    .co{display:none;}
  }
  @media(prefers-reduced-motion:reduce){
    .tape-run{animation:none;}
  }
  :focus-visible{outline:2px solid var(--mark); outline-offset:2px;}
</style>
</head>
<body>

  <div class="tape"><div class="tape-run" id="tape"></div></div>

  <header class="masthead">
    <div class="nameplate">Vantage</div>
    <div class="tagline">Boletín privado de niveles · las órdenes las pasás vos</div>
    <div class="dateline">
      <span id="dateLeft">—</span>
      <span class="mid" id="dateMid">Cargando…</span>
      <span id="dateRight">—</span>
    </div>
  </header>

  <main class="sheet">
    <section class="quotes">
      <div class="head-rule">
        <h2>Cotizaciones</h2>
        <span class="label" id="quoteCount">—</span>
      </div>
      <div id="quotes"><div class="note">Cargando el boletín…</div></div>
      <div class="errline" id="quoteErrors"></div>
    </section>

    <section class="wire">
      <div class="head-rule">
        <h2>Teletipo</h2>
        <span class="label" id="wireRange">—</span>
      </div>
      <div id="wire"></div>
    </section>
  </main>

  <section class="leader">
    <span class="label" id="leaderBadge">Editorial de la sesión</span>
    <h2>La lectura</h2>
    <div class="leader-body" id="leaderBody">Cargando…</div>
  </section>

  <section class="radar" id="radarSection" hidden>
    <div class="head-rule">
      <h2>Radar</h2>
      <span class="label" id="radarCount">—</span>
    </div>
    <p class="radar-note" id="radarNote"></p>
    <div id="radarTable"></div>
  </section>

  <section class="colophon">
    <div class="head-rule">
      <h2>Estado del sistema</h2>
      <span class="label">Solo tú puedes ver esto</span>
    </div>
    <div class="colophon-grid" id="colophon"></div>
  </section>

  <footer id="footer">Vantage — recomendaciones para operar a mano</footer>

<script>
  // El boletín no habla con OANDA: lee data.json, que genera publish.py en tu
  // máquina. Así la API key nunca llega al navegador.
  const REFRESH_MS = 5 * 60 * 1000;

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

  const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
                 "agosto","septiembre","octubre","noviembre","diciembre"];
  const DIAS = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

  const hhmm = iso => iso
    ? new Date(iso).toLocaleTimeString("es-ES", {hour:"2-digit", minute:"2-digit"})
    : "—";

  function stampFor(r){
    if(r.signal === "ENTRADA")
      return r.direction === "buy"
        ? {cls:"entry-buy",  txt:"Entrada · compra"}
        : {cls:"entry-sell", txt:"Entrada · venta"};
    if(r.signal === "PRECAUCION") return {cls:"caution", txt:"Precaución"};
    return {cls:"watch", txt:"En observación"};
  }

  function sparkPoints(spark){
    if(!spark || spark.length < 2) return "";
    const w = 84, h = 26, pad = 2;
    const step = w / (spark.length - 1);
    return spark.map((v,i) =>
      `${(i*step).toFixed(1)},${(h - pad - v*(h - pad*2)).toFixed(1)}`).join(" ");
  }

  function renderTape(items){
    if(!items.length){ $("tape").innerHTML = ""; return; }
    const run = () => items.map(i => {
      const up = i.change_pct >= 0;
      return `<span><b>${esc(i.display_symbol)}</b>${esc(i.price)} `
           + `<span class="${up?'up':'down'}">${up?'▲':'▼'}${Math.abs(i.change_pct).toFixed(2)}%</span></span>`;
    }).join("");
    $("tape").innerHTML = run() + run();
  }

  function renderQuote(r){
    const up = r.change_pct >= 0;
    const stamp = stampFor(r);
    const pts = sparkPoints(r.spark);
    const stroke = up ? "#1B5E43" : "#9E2B21";

    const flags = `<span class="flag">${esc(r.asset_class)}</span>`
      + (r.promoted ? `<span class="flag analysis">Del radar</span>` : "")
      + (r.activity_spike ? `<span class="flag analysis">${esc(r.volume_based ? "Volumen" : "Rango")} ${esc(r.activity_ratio)}×</span>` : "");

    const levels = r.direction ? `
      <dl class="levels">
        <div class="lvl"><dt>Entrada</dt><dd>${esc(r.entry)}</dd></div>
        <div class="lvl tp"><dt>Take profit</dt><dd>${esc(r.take_profit)}</dd></div>
        <div class="lvl sl"><dt>Stop loss</dt><dd>${esc(r.stop_loss)}</dd></div>
        <div class="lvl rr"><dt>Riesgo / beneficio</dt><dd>1 : ${esc(r.rr_ratio)}</dd></div>
      </dl>` : "";

    return `
      <article class="quote">
        <div class="quote-top">
          <div>
            <span class="sym">${esc(r.display_symbol)}</span><span class="co">${esc(r.name)}</span>${flags}
          </div>
          <div class="px">
            <div class="now">${esc(r.price)}</div>
            <div class="chg ${up?'up':'down'}">${up?'▲':'▼'} ${Math.abs(r.change_pct).toFixed(2)}%</div>
          </div>
        </div>
        <div class="quote-mid">
          <p class="read">${esc(r.reason)}</p>
          ${pts ? `<svg class="spark" width="84" height="26" viewBox="0 0 84 26" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="1.6"/></svg>` : ""}
        </div>
        ${levels}
        <div class="quote-foot">
          <span class="stamp ${stamp.cls}">${stamp.txt}</span>
          <span class="meta">RSI ${esc(r.rsi)} · soporte ${esc(r.support)} / resistencia ${esc(r.resistance)}</span>
        </div>
      </article>`;
  }

  function renderQuotes(data){
    const list = data.watchlist || [];
    $("quoteCount").textContent = list.length ? `${list.length} valores` : "sin datos";

    if(!list.length){
      $("quotes").innerHTML = `
        <div class="note">
          <strong>El boletín todavía no tiene datos.</strong><br>
          Ejecutá <code>python3 publish.py</code> en tu máquina para generar
          <code>data.json</code>, y subilo con <code>git push</code>.
        </div>`;
    } else {
      const macro  = list.filter(r => r.asset_class !== "Acción");
      const equity = list.filter(r => r.asset_class === "Acción");
      let html = "";
      if(macro.length){
        html += `<div class="subhead">Divisas, metales e índices</div>`
             +  macro.map(renderQuote).join("");
      }
      if(equity.length){
        html += `<div class="subhead">Acciones</div>`
             +  equity.map(renderQuote).join("");
      }
      $("quotes").innerHTML = html;
    }

    const errors = data.errors || [];
    $("quoteErrors").textContent = errors.length
      ? "Sin datos para: " + errors.map(e => `${e.symbol} (${e.error})`).join(" · ")
      : "";
  }

  function renderWire(data){
    const events = data.events || [];
    $("wireRange").textContent = events.length ? "Últimos avisos" : "—";

    if(!events.length){
      $("wire").innerHTML = `<div class="note">Sin avisos todavía. Aparecen acá cuando el
        analyzer detecta un setup, un volumen inusual o una ruptura de nivel.</div>`;
      return;
    }

    $("wire").innerHTML = events.map(e => `
      <div class="item">
        <div class="item-head">
          <span class="item-sym"><span class="kind ${esc(e.kind_class || "")}">${esc(e.kind)}</span>${esc(e.symbol)}</span>
          <span class="item-time">${hhmm(e.time)}</span>
        </div>
        <div class="item-body">${e.body}</div>
      </div>`).join("");
  }

  function renderRadar(data){
    const radar = data.radar || {};
    const top = radar.top || [];
    const section = $("radarSection");

    if(!top.length){ section.hidden = true; return; }
    section.hidden = false;

    $("radarCount").textContent =
      `${radar.candidates} de ${radar.universe_size} · velas ${radar.timeframe || "1d"}`;

    const enSeguimiento = new Set((data.watchlist || []).map(r => r.symbol));

    $("radarNote").textContent =
      `Barrido diario del universo completo. Los ${Math.min(8, top.length)} primeros `
      + `pasan a seguimiento horario; el aviso de entrada llega cuando la vela de una `
      + `hora lo confirma. `
      + (radar.reviewed
          ? `Los ${radar.reviewed} mejores llevan revisión que cruza lo técnico con los `
            + `números de la empresa. El veredicto es un contraste, no una previsión.`
          : `El orden es una heurística, no una probabilidad.`);

    const conRevision = top.some(r => r.ai);

    $("radarTable").innerHTML = `
      <table class="rank">
        <thead>
          <tr>
            <th></th><th>Valor</th><th class="co">Nombre</th><th>Sentido</th>
            ${conRevision ? "<th>Revisión</th>" : ""}
            <th class="num">Entrada</th><th class="num">Objetivo</th>
            <th class="num">Stop</th><th class="num">R/B</th><th class="num">Punt.</th>
          </tr>
        </thead>
        <tbody>
          ${top.map((r,i) => fila(r, i, conRevision, enSeguimiento)).join("")}
        </tbody>
      </table>
      ${bloqueConjunto(radar.portfolio)}`;

    $("radarTable").querySelectorAll(".expand").forEach(btn => {
      btn.addEventListener("click", () => {
        const fila = document.getElementById(btn.dataset.target);
        const abierto = fila.hasAttribute("hidden");
        fila.toggleAttribute("hidden");
        btn.textContent = abierto ? "▲ cerrar" : "▼ análisis";
      });
    });
  }

  function fila(r, i, conRevision, enSeguimiento){
    const v = r.ai;
    const id = `an-${i}`;
    const celdaRevision = conRevision ? `
      <td>${v
        ? `<span class="verdict ${esc(v.veredicto)}">${esc(v.veredicto)} ${esc(v.conviccion)}/5</span>`
        : `<span class="verdict none">sin revisar</span>`}</td>` : "";

    const principal = `
      <tr>
        <td class="pos">${i+1}</td>
        <td class="tk">${esc(r.display_symbol)}${
          enSeguimiento.has(r.symbol) ? `<span class="promoted">En seguimiento</span>` : ""
        }</td>
        <td class="co">${esc(r.name)}${
          v ? `<br><button class="expand" data-target="${id}">▼ análisis</button>` : ""
        }</td>
        <td><span class="dir ${r.direction === "buy" ? "buy" : "sell"}">${
          r.direction === "buy" ? "Compra" : "Venta"
        }</span></td>
        ${celdaRevision}
        <td class="num">${esc(r.entry)}</td>
        <td class="num">${esc(r.take_profit)}</td>
        <td class="num">${esc(r.stop_loss)}</td>
        <td class="num">1:${esc(r.rr_ratio)}</td>
        <td class="num">${esc(r.score)}</td>
      </tr>`;

    if(!v) return principal;

    const detalle = `
      <tr class="detail" id="${id}" hidden>
        <td colspan="${conRevision ? 10 : 9}">
          <div class="analysis">
            ${v.conflicto ? `<div class="clash"><strong>Contradicción:</strong> ${esc(v.conflicto)}</div>` : ""}
            <div>
              <h4>Lectura técnica</h4>
              <p>${esc(v.tecnico)}</p>
            </div>
            <div>
              <h4>Lectura económica</h4>
              <p>${esc(v.economico)}</p>
            </div>
            ${(v.riesgos && v.riesgos.length) ? `
              <div class="full">
                <h4>Riesgos</h4>
                <ul>${v.riesgos.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
              </div>` : ""}
            ${v.invalidaria ? `
              <div class="full">
                <h4>Qué invalidaría la idea</h4>
                <p>${esc(v.invalidaria)}</p>
              </div>` : ""}
            ${v.tiene_fundamentales === false ? `
              <div class="no-fund">Sin datos fundamentales: no es una empresa cotizada,
              así que la lectura económica es contexto, no cifras.</div>` : ""}
          </div>
        </td>
      </tr>`;

    return principal + detalle;
  }

  function bloqueConjunto(p){
    if(!p) return "";
    const partes = [];
    if(p.concentracion) partes.push(`<p><strong>Concentración:</strong> ${esc(p.concentracion)}</p>`);
    if(p.contradicciones) partes.push(`<p><strong>Contradicciones:</strong> ${esc(p.contradicciones)}</p>`);
    if(p.advertencia) partes.push(`<p>${esc(p.advertencia)}</p>`);
    if(!partes.length) return "";
    return `<div class="portfolio"><h4>Visión de conjunto</h4>${partes.join("")}</div>`;
  }

  function renderColophon(data){
    $("colophon").innerHTML = (data.status || []).map(c => `
      <div class="col-card">
        <h3><span class="bulb ${esc(c.pulse)}"></span>${esc(c.name)}</h3>
        <div class="col-rows">
          ${(c.rows || []).map(([k,v]) => `<div><span class="k">${esc(k)}:</span> ${esc(v)}</div>`).join("")}
        </div>
        <span class="pill">${esc(c.pill)}</span>
      </div>`).join("");
  }

  function renderMasthead(data){
    const d = new Date(data.generated_at);
    const ageMin = Math.round((Date.now() - d.getTime()) / 60000);

    $("dateLeft").textContent =
      `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;

    $("dateMid").innerHTML = `Cierre de edición ${hhmm(data.generated_at)} ${esc(data.timezone_label || "")}`
      + (ageMin > 90 ? ` <span class="stale">· ${ageMin} min de retraso</span>` : "");

    const entradas = (data.watchlist || []).filter(r => r.signal === "ENTRADA").length;
    $("dateRight").textContent =
      `${(data.watchlist||[]).length} valores · ${entradas} con señal · velas ${data.granularity}`;

    $("footer").textContent =
      "Vantage — recomendaciones para operar a mano · no es asesoría financiera regulada · "
      + `datos de ${data.source || "Yahoo Finance"}`;
  }

  function renderFailure(msg){
    $("dateMid").innerHTML = `<span class="stale">Sin edición</span>`;
    $("dateLeft").textContent = "—";
    $("dateRight").textContent = "—";
    $("quotes").innerHTML = `
      <div class="note">
        <strong>No se pudo cargar data.json.</strong><br>${esc(msg)}<br><br>
        Generalo con <code>python3 publish.py</code> y subilo al repo.
      </div>`;
    $("wire").innerHTML = "";
    $("radarSection").hidden = true;
    $("leaderBody").textContent = "—";
  }

  async function load(){
    try{
      const res = await fetch(`./data.json?t=${Date.now()}`, {cache:"no-store"});
      if(!res.ok) throw new Error(`El servidor respondió ${res.status}`);
      const data = await res.json();

      renderMasthead(data);
      renderTape(data.watchlist || []);
      renderQuotes(data);
      renderWire(data);
      renderRadar(data);
      renderColophon(data);
      $("leaderBody").innerHTML = data.brief || "Sin resumen para esta sesión.";
    }catch(err){
      renderFailure(err.message);
    }
  }

  load();
  setInterval(load, REFRESH_MS);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) load(); });
</script>

</body>
</html>
