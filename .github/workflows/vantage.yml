name: Vantage

on:
  schedule:
    # Cada hora en el minuto 17, de 06:00 a 21:00 UTC, de lunes a viernes.
    - cron: '17 6-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vantage
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Analizar y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PANEL_TIMEZONE_LABEL: UTC
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python bot.py

      - name: Publicar los datos del panel
        run: |
          git config user.name  "Vantage"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json events.json
          git diff --staged --quiet && echo "Sin cambios" && exit 0
          git commit -m "Datos del panel — $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
